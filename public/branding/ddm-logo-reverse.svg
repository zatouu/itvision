  <!-- Tagline -->
  <text x="115" y="90" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="11" fill="#94A3B8" letter-spacing="0.15em" text-anchor="middle">DIEUND DAL MA</text>
