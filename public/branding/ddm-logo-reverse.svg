  <!-- Main wordmark DDM -->
  <text x="20" y="62" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="-0.02em">DDM</text>
  <!-- Plus symbol -->
  <g transform="translate(178, 32)">
    <rect x="0" y="14" width="32" height="8" rx="3" fill="#10B981"/>
    <rect x="12" y="2" width="8" height="32" rx="3" fill="#10B981"/>
  </g>
  <!-- Divider -->
