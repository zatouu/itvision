<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="DDM+ Dieund Dal Ma">
  <title>DDM+ — Dieund Dal Ma</title>
  <defs>
    <!-- Motif triangle africain alterné -->
    <pattern id="african-pattern" patternUnits="userSpaceOnUse" width="30" height="30" patternTransform="rotate(0)">
      <!-- Triangle 1 - terracotta -->
      <polygon points="0,0 15,15 0,30" fill="#C2410C"/>
      <!-- Triangle 2 - ocre -->
      <polygon points="15,15 30,0 30,30" fill="#CA8A04"/>
      <!-- Petit losange charbon -->
      <polygon points="7.5,15 15,7.5 22.5,15 15,22.5" fill="#1E293B" opacity="0.85"/>
      <!-- Trait vert tissu (pointillé) -->
      <circle cx="15" cy="0" r="1.5" fill="#10B981"/>
      <circle cx="15" cy="30" r="1.5" fill="#10B981"/>
      <circle cx="0" cy="15" r="1.5" fill="#10B981"/>
      <circle cx="30" cy="15" r="1.5" fill="#10B981"/>
    </pattern>
    <!-- Masque circulaire pour la bande -->
    <mask id="ring-mask">
      <circle cx="200" cy="200" r="195" fill="white"/>
      <circle cx="200" cy="200" r="155" fill="black"/>
    </mask>
  </defs>

  <!-- Cercle de fond crème -->
  <circle cx="200" cy="200" r="195" fill="#FEF3C7"/>

  <!-- BANDE TISSU AFRICAIN (anneau circulaire) -->
  <g mask="url(#ring-mask)">
    <circle cx="200" cy="200" r="195" fill="url(#african-pattern)"/>
  </g>

  <!-- Liserés intérieur et extérieur -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#1E293B" stroke-width="2"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Cercle blanc intérieur (zone du wordmark) -->
  <circle cx="200" cy="200" r="153" fill="#FFFFFF"/>

  <!-- WORDMARK DDM+ -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <!-- "DDM" en navy -->
    <text x="170" y="195" font-size="78" font-weight="900" fill="#0F172A" letter-spacing="-2">DDM</text>
    <!-- "+" en emerald (même vert que le tissu) -->
    <text x="265" y="195" font-size="78" font-weight="900" fill="#10B981" letter-spacing="0">+</text>
  </g>

  <!-- Divider line -->
  <line x1="140" y1="218" x2="260" y2="218" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- TAGLINE "Dieund Dal Ma" -->
  <text x="200" y="248"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-style="italic"
        font-weight="500"
        fill="#334155"
        text-anchor="middle"
        letter-spacing="1">Dieund Dal Ma</text>

  <!-- Petits "+" décoratifs aux 4 points cardinaux -->
  <g fill="#10B981" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    <text x="200" y="32" font-size="16">+</text>
    <text x="368" y="206" font-size="16">+</text>
    <text x="200" y="380" font-size="16">+</text>
    <text x="32" y="206" font-size="16">+</text>
  </g>
</svg>
