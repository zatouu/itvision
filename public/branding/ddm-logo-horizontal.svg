<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" aria-label="DDM+ Dieund Dal Ma">
  <view id="compact" viewBox="0 0 164 56"/>
  <view id="compact-dark" viewBox="0 0 164 56"/>
  <view id="dark" viewBox="0 0 280 60"/>
  <style>
    #compact-dark:target ~ .wordmark, #dark:target ~ .wordmark { fill: #F8FAFC; }
    #dark:target ~ .tagline { fill: #CBD5E1; }
  </style>
  <text class="wordmark" x="10" y="40" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="40" fill="#0F172A">DDM</text>
  <g transform="translate(130, 14)">
    <rect x="0" y="10" width="24" height="6" rx="2" fill="#10B981"/>
    <rect x="9" y="1" width="6" height="24" rx="2" fill="#10B981"/>
  </g>
  <text class="tagline" x="170" y="26" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10" fill="#64748B">DIEUND DAL MA</text>
</svg>
