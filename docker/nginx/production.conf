# ============================================================
# Nginx reverse proxy configuration for production
# Handles subdomain routing at the proxy level.
# Next.js runs with PROXY_SUBDOMAIN_ROUTING=true so the
# middleware skips subdomain rewrites/redirects.
# ============================================================

upstream app {
    server app:3000;
    keepalive 32;
}

# --- Let's Encrypt challenge (shared) ---
server {
    listen 80;
    server_name itvisionplus.sn www.itvisionplus.sn market.itvisionplus.sn services.itvisionplus.sn app.itvisionplus.sn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Corporate domain : itvisionplus.sn ---
server {
    listen 443 ssl http2;
    server_name itvisionplus.sn www.itvisionplus.sn;

    # SSL certificates (replace with certbot paths)
    ssl_certificate /etc/letsencrypt/live/itvisionplus.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itvisionplus.sn/privkey.pem;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /_next/static {
        proxy_pass http://app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads {
        alias /var/www/uploads;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/upload {
        client_max_body_size 150m;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

