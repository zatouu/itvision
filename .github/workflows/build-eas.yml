name: Build Expo App (EAS)

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-eas.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile (ec2 / preview / production)'
        required: true
        default: 'ec2'
        type: choice
        options:
          - ec2
          - preview
          - production

jobs:
  build-app:
    name: Build Xeuy Bi APK (app unifiée)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile/app
        run: npm ci

      - name: Build Android
        working-directory: mobile/app
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'ec2' }} --non-interactive --no-wait
