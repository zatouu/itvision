name: Build & Deploy to EC2 (GHCR + Compose)

on:
  push:
    branches: [ main, cursor/*, deploy/*, rel/ui-refresh ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate image tags and labels
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          REF_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHA=${{ github.sha }}
          {
            echo "tags<<EOF"
            echo "${REPO_LOWER}:latest"
            echo "${REPO_LOWER}:sha-${SHA}"
            echo "${REPO_LOWER}:${REF_SAFE}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64 — EC2 Graviton)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=itvision-build
          cache-to: type=gha,mode=min,scope=itvision-build

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/itvision/docker/mongodb ~/itvision/docker/nginx

      - name: Copy compose and init script to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.ec2.yml,docker/mongodb/init.js,docker/nginx/ec2-default.conf"
          target: "~/itvision"

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 300s
          command_timeout: 600s
          script: |
            set -e
            export APP_DIR=~/itvision
            mkdir -p $APP_DIR

            # Installer Docker et Compose si absents
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            if ! docker compose version >/dev/null 2>&1; then
              DOCKER_CONFIG=${HOME}/.docker
              mkdir -p $DOCKER_CONFIG/cli-plugins
              ARCH=$(uname -m)
              if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                COMPOSE_ARCH="aarch64"
              else
                COMPOSE_ARCH="x86_64"
              fi
              curl -SL "https://github.com/docker/compose/releases/download/v2.30.3/docker-compose-linux-${COMPOSE_ARCH}" -o $DOCKER_CONFIG/cli-plugins/docker-compose
              chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            fi

            # Installer Nginx + Certbot si absents (reverse proxy + SSL)
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx certbot python3-certbot-nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # Configurer Nginx reverse proxy si pas déjà fait
            if [ ! -f /etc/nginx/sites-enabled/itvision ]; then
              sudo mkdir -p /var/www/certbot
              sudo cp $APP_DIR/docker/nginx/ec2-default.conf /etc/nginx/sites-available/itvision
              sudo ln -sf /etc/nginx/sites-available/itvision /etc/nginx/sites-enabled/itvision
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # Firewall (ouvrir 80/443 si ufw présent)
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 80/tcp || true
              sudo ufw allow 443/tcp || true
              sudo ufw allow 22/tcp || true
            fi

            # SSL auto via Certbot (seulement si DNS résolu et pas déjà certifié)
            DOMAIN=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            DOMAIN=${DOMAIN#https://}
            DOMAIN=${DOMAIN#http://}
            DOMAIN=${DOMAIN%%/*}
            if [ "$DOMAIN" != "localhost" ] && [ -n "$DOMAIN" ]; then
              if [ ! -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem ]; then
                echo "🔐 Génération certificat SSL pour $DOMAIN..."
                sudo certbot --nginx -d $DOMAIN -d www.$DOMAIN -d market.$DOMAIN \
                  --email contact@$DOMAIN --agree-tos --no-eff-email --redirect \
                  --non-interactive || echo "⚠️ SSL différé — vérifier DNS"
              fi
            fi

            cd $APP_DIR

            # Construire .env.ec2 à partir des secrets GitHub
            echo "MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}" > .env.ec2
            echo "MONGO_APP_PASSWORD=${{ secrets.MONGO_APP_PASSWORD }}" >> .env.ec2
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.ec2
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.ec2
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env.ec2
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env.ec2
            echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> .env.ec2
            echo "APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}" >> .env.ec2
            echo "MONGODB_URI=mongodb://itvision_app:${{ secrets.MONGO_APP_PASSWORD }}@mongodb:27017/itvision_db" >> .env.ec2
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.ec2
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env.ec2
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env.ec2
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.ec2
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.ec2
            echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> .env.ec2
            echo "SMTP_SECURE=${{ secrets.SMTP_SECURE }}" >> .env.ec2
            echo "SMS_PROVIDER=${{ secrets.SMS_PROVIDER }}" >> .env.ec2
            echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env.ec2
            echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env.ec2
            echo "TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}" >> .env.ec2
            echo "ALLOW_TEST_CODES=${{ secrets.ALLOW_TEST_CODES }}" >> .env.ec2
            echo "PAYMENTS_MOCK=${{ secrets.PAYMENTS_MOCK }}" >> .env.ec2
            echo "PAYDUNYA_MASTER_KEY=${{ secrets.PAYDUNYA_MASTER_KEY }}" >> .env.ec2
            echo "PAYDUNYA_PRIVATE_KEY=${{ secrets.PAYDUNYA_PRIVATE_KEY }}" >> .env.ec2
            echo "PAYDUNYA_TOKEN=${{ secrets.PAYDUNYA_TOKEN }}" >> .env.ec2
            echo "PAYDUNYA_MODE=${{ secrets.PAYDUNYA_MODE }}" >> .env.ec2
            echo "PAYDUNYA_STORE_NAME=${{ secrets.PAYDUNYA_STORE_NAME }}" >> .env.ec2
            echo "APP_BASE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env.ec2
            echo "WAVE_MERCHANT_PHONE=${{ secrets.WAVE_MERCHANT_PHONE }}" >> .env.ec2
            echo "WAVE_QR_URL=${{ secrets.WAVE_QR_URL }}" >> .env.ec2
            echo "WAVE_PAY_URL=${{ secrets.WAVE_PAY_URL }}" >> .env.ec2
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env.ec2
            echo "QWEN_CLOUD_API_KEY=${{ secrets.QWEN_CLOUD_API_KEY }}" >> .env.ec2
            echo "QWEN_CLOUD_BASE_URL=${{ secrets.QWEN_CLOUD_BASE_URL }}" >> .env.ec2
            echo "QWEN_MODEL=${{ secrets.QWEN_MODEL }}" >> .env.ec2
            

            # Login au registre GHCR avec le token GitHub natif (packages: write déjà accordé)
            echo "${{ github.token }}" | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull de l'image avec retry (3 tentatives en cas de timeout réseau)
            MAX_RETRIES=3
            RETRY_DELAY=10
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Tentative $i/$MAX_RETRIES de pull de l'image..."
              if sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest; then
                echo "Pull réussi!"
                break
              else
                if [ $i -eq $MAX_RETRIES ]; then
                  echo "Échec après $MAX_RETRIES tentatives"
                  exit 1
                fi
                echo "Échec, nouvelle tentative dans ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              fi
            done

            # Démarrage/MAJ des services
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml up -d

            # Vérification santé
            echo "⏳ Attente démarrage app..."
            sleep 15
            if curl -sSf http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "✅ App healthy!"
            else
              echo "⚠️ App pas encore ready — vérifier logs: docker compose logs app"
            fi
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml ps

            # Nettoyage des anciennes images
            sudo docker image prune -f
