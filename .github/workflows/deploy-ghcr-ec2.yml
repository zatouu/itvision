name: Build & Deploy to EC2 (GHCR + Compose)

on:
  push:
    branches: [ main, cursor/*, deploy/*, rel/ui-refresh, feat/mobile-fusion, feature/corporate-evolutions, feature/barakalah ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Autoriser explicitement le deploiement EC2 apres validation'
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Aucune image n'est construite ni déployée si ces contrôles échouent
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Type-check
        env:
          DATABASE_URL: file:/tmp/build-only.db
        run: npm run db:generate && npm run type-check

      - name: Registre des domaines (AGENTS.md)
        run: npm run test:domains

      - name: Frontières inter-domaines (rapport)
        run: npm run test:boundaries

      - name: Capacités portail entreprise
        run: npm run test:capabilities

      - name: Garde-fous du sourcing
        run: npm run test:sourcing-policy

      - name: Tarification et quantites import
        run: npm run test:pricing

      - name: Schemas et precontrole de production
        run: npm run test:production-readiness

  # Recette API et navigateur sur une base jetable
  # e2e:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   permissions:
  #     contents: read
  #   env:
  #     PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  #     PUPPETEER_SKIP_DOWNLOAD: '1'
  #     CI: 'true'
  #     MONGODB_URI: mongodb://localhost:27017/itvision_e2e?replicaSet=rs0
  #     REDIS_URL: redis://localhost:6379
  #     JWT_SECRET: ci-e2e-only-jwt-secret-not-used-elsewhere-0123456789
  #     NEXTAUTH_SECRET: ci-e2e-only-nextauth-secret-not-used-elsewhere-0123
  #     CRON_SECRET: e2e-cron-secret
  #     PAYMENTS_MOCK: 'true'
  #     NEXT_TELEMETRY_DISABLED: '1'
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5

  #     - name: MongoDB (replica set pour les transactions) et Redis
  #       run: |
  #         docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
  #         docker run -d --name redis -p 6379:6379 redis:7-alpine
  #         for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break; sleep 2; done
  #         docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
  #         for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ] && break; sleep 2; done

  #     - name: Setup Node
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm

  #     - name: Install
  #       run: npm ci --legacy-peer-deps --no-audit --no-fund

  #     - name: Initialiser les couts transporteur E2E
  #       run: npm run migrate:market-pricing

  #     - name: Installer Chromium pour les tests navigateur
  #       run: npx playwright install --with-deps chromium

  #     - name: Playwright (API marketplace + corporate)
  #       run: npx playwright test tests/marketplace tests/corporate/capabilities.spec.ts tests/corporate/sourcing.spec.ts --project=chromium

  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test -- --runInBand --silent

  build-and-push:
    needs: [quality, mobile-quality]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate image tags and labels
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          REF_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHA=${{ github.sha }}
          {
            echo "tags<<EOF"
            # latest = image de production (main) ; les autres branches n'écrasent plus ce tag
            if [ "${{ github.ref_name }}" = "main" ]; then echo "${REPO_LOWER}:latest"; fi
            echo "${REPO_LOWER}:sha-${SHA}"
            echo "${REPO_LOWER}:${REF_SAFE}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verifier l'architecture et la memoire du runner
        run: |
          test "$(uname -m)" = "aarch64"
          free -m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64 — EC2 Graviton)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_BUILD_HEAP_MB=${{ vars.NEXT_BUILD_HEAP_MB || '6144' }}
          cache-from: type=gha,scope=itvision-build
          cache-to: type=gha,mode=min,scope=itvision-build

  image-check:
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tester l'image exacte sur une base jetable
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${IMAGE_DIGEST}"
          docker network create audit-image
          docker run -d --name audit-mongo --network audit-image mongo:7 --replSet rs0 --bind_ip_all
          docker run -d --name audit-redis --network audit-image redis:7-alpine
          for attempt in $(seq 1 30); do
            docker exec audit-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' && break
            sleep 2
          done
          docker exec audit-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"audit-mongo:27017"}]})'
          for attempt in $(seq 1 30); do
            [ "$(docker exec audit-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = 'true' ] && break
            sleep 2
          done
          docker run --rm --platform linux/arm64 "$IMAGE" node scripts/check-production-runtime.cjs --files-only
          docker run --rm --platform linux/arm64 --network audit-image \
            -e MONGODB_URI='mongodb://audit-mongo:27017/audit_image_test?replicaSet=rs0' \
            "$IMAGE" node .ops/migrate-shipping-costs.cjs --apply
          docker run -d --name audit-app --platform linux/arm64 --network audit-image -p 127.0.0.1:3000:3000 \
            -e MONGODB_URI='mongodb://audit-mongo:27017/audit_image_test?replicaSet=rs0' \
            -e REDIS_URL='redis://audit-redis:6379' \
            -e JWT_SECRET='ci-image-only-jwt-secret-01234567890123456789' \
            -e NEXTAUTH_SECRET='ci-image-only-nextauth-secret-01234567890123' \
            -e CRON_SECRET='ci-image-only-cron-secret' \
            -e MAINTENANCE_CRON_DISABLED=true -e AGENT_WORKER_ENABLED=false \
            -e SMS_PROVIDER=console -e PAYMENTS_MOCK=true "$IMAGE"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/api/health
          docker exec audit-app node .ops/production-preflight.cjs
          docker exec audit-app node scripts/check-production-runtime.cjs
      - name: Diagnostic en cas d'echec
        if: failure()
        run: docker logs --tail 100 audit-app || true
      - name: Nettoyer la recette jetable
        if: always()
        run: |
          docker rm -f audit-app audit-mongo audit-redis || true
          docker network rm audit-image || true

  deploy:
    needs: [build-and-push, image-check]
   # if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Ensure target directory exists on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/itvision/docker/mongodb ~/itvision/docker/nginx

      - name: Copy compose and init script to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.ec2.yml,docker/mongodb/init.js,docker/nginx/ec2-default.conf"
          target: "~/itvision"

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 300s
          command_timeout: 600s
          script: |
            set -e
            export APP_DIR=~/itvision
            mkdir -p $APP_DIR

            IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            DEPLOY_IMAGE="${IMAGE_BASE}@${{ needs.build-and-push.outputs.digest }}"
            echo "🐳 Déploiement image : $DEPLOY_IMAGE"

            # Installer Docker et Compose si absents
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            fi
            if ! docker compose version >/dev/null 2>&1; then
              DOCKER_CONFIG=${HOME}/.docker
              mkdir -p $DOCKER_CONFIG/cli-plugins
              ARCH=$(uname -m)
              if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                COMPOSE_ARCH="aarch64"
              else
                COMPOSE_ARCH="x86_64"
              fi
              curl -SL "https://github.com/docker/compose/releases/download/v2.30.3/docker-compose-linux-${COMPOSE_ARCH}" -o $DOCKER_CONFIG/cli-plugins/docker-compose
              chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            fi

            # Installer Nginx + Certbot si absents (reverse proxy + SSL)
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx certbot python3-certbot-nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
            fi

            # Configurer Nginx reverse proxy si pas déjà fait
            if [ ! -f /etc/nginx/sites-enabled/itvision ]; then
              sudo mkdir -p /var/www/certbot
              sudo cp $APP_DIR/docker/nginx/ec2-default.conf /etc/nginx/sites-available/itvision
              sudo ln -sf /etc/nginx/sites-available/itvision /etc/nginx/sites-enabled/itvision
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # Firewall (ouvrir 80/443 si ufw présent)
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 80/tcp || true
              sudo ufw allow 443/tcp || true
              sudo ufw allow 22/tcp || true
            fi

            # SSL auto via Certbot (seulement si DNS résolu et pas déjà certifié)
            DOMAIN=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            DOMAIN=${DOMAIN#https://}
            DOMAIN=${DOMAIN#http://}
            DOMAIN=${DOMAIN%%/*}
            if [ "$DOMAIN" != "localhost" ] && [ -n "$DOMAIN" ]; then
              if [ ! -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem ]; then
                echo "🔐 Génération certificat SSL pour $DOMAIN..."
                sudo certbot --nginx -d $DOMAIN -d www.$DOMAIN -d market.$DOMAIN \
                  --email contact@$DOMAIN --agree-tos --no-eff-email --redirect \
                  --non-interactive || echo "⚠️ SSL différé — vérifier DNS"
              fi
            fi

            cd $APP_DIR

            # Construire .env.ec2 à partir des secrets GitHub
            echo "MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}" > .env.ec2
            echo "MONGO_APP_PASSWORD=${{ secrets.MONGO_APP_PASSWORD }}" >> .env.ec2
            echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.ec2
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.ec2
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env.ec2
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env.ec2
            echo "IMAGE=${DEPLOY_IMAGE}" >> .env.ec2
            echo "APIFY_TOKEN=${{ secrets.APIFY_TOKEN }}" >> .env.ec2
            echo "MONGODB_URI=mongodb://itvision_app:${{ secrets.MONGO_APP_PASSWORD }}@mongodb:27017/itvision_db" >> .env.ec2
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env.ec2
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env.ec2
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env.ec2
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env.ec2
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env.ec2
            echo "SMTP_FROM=${{ secrets.SMTP_FROM }}" >> .env.ec2
            echo "SMTP_SECURE=${{ secrets.SMTP_SECURE }}" >> .env.ec2
            echo "SMS_PROVIDER=${{ secrets.SMS_PROVIDER }}" >> .env.ec2
            echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env.ec2
            echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env.ec2
            echo "TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}" >> .env.ec2
            echo "ALLOW_TEST_CODES=${{ secrets.ALLOW_TEST_CODES }}" >> .env.ec2
            echo "OTP_TEST_PHONES=${{ secrets.OTP_TEST_PHONES }}" >> .env.ec2
            echo "PAYMENTS_MOCK=${{ secrets.PAYMENTS_MOCK }}" >> .env.ec2
            echo "PAYDUNYA_MASTER_KEY=${{ secrets.PAYDUNYA_MASTER_KEY }}" >> .env.ec2
            echo "PAYDUNYA_PRIVATE_KEY=${{ secrets.PAYDUNYA_PRIVATE_KEY }}" >> .env.ec2
            echo "PAYDUNYA_TOKEN=${{ secrets.PAYDUNYA_TOKEN }}" >> .env.ec2
            echo "PAYDUNYA_MODE=${{ secrets.PAYDUNYA_MODE }}" >> .env.ec2
            echo "PAYDUNYA_STORE_NAME=${{ secrets.PAYDUNYA_STORE_NAME }}" >> .env.ec2
            echo "APP_BASE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .env.ec2
            echo "WAVE_MERCHANT_PHONE=${{ secrets.WAVE_MERCHANT_PHONE }}" >> .env.ec2
            echo "WAVE_QR_URL=${{ secrets.WAVE_QR_URL }}" >> .env.ec2
            echo "WAVE_PAY_URL=${{ secrets.WAVE_PAY_URL }}" >> .env.ec2
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env.ec2
            echo "STT_API_URL=${{ vars.STT_API_URL }}" >> .env.ec2
            echo "STT_API_KEY=${{ secrets.STT_API_KEY }}" >> .env.ec2
            echo "STT_MODEL=${{ vars.STT_MODEL }}" >> .env.ec2
            echo "STT_FALLBACK_API_URL=${{ vars.STT_FALLBACK_API_URL }}" >> .env.ec2
            echo "STT_FALLBACK_API_KEY=${{ secrets.STT_FALLBACK_API_KEY }}" >> .env.ec2
            echo "STT_FALLBACK_MODEL=${{ vars.STT_FALLBACK_MODEL }}" >> .env.ec2
            echo "QWEN_CLOUD_API_KEY=${{ secrets.QWEN_CLOUD_API_KEY }}" >> .env.ec2
            echo "QWEN_CLOUD_BASE_URL=${{ secrets.QWEN_CLOUD_BASE_URL }}" >> .env.ec2
            echo "QWEN_MODEL=${{ secrets.QWEN_MODEL }}" >> .env.ec2
            echo "CRON_SECRET=${{ secrets.CRON_SECRET }}" >> .env.ec2
            echo "TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}" >> .env.ec2
            echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env.ec2
            echo "REGISTRATION_CAPTCHA=${{ vars.REGISTRATION_CAPTCHA }}" >> .env.ec2
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env.ec2
            echo "MAINTENANCE_CRON_DISABLED=${{ secrets.MAINTENANCE_CRON_DISABLED }}" >> .env.ec2
            echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env.ec2
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env.ec2
            echo "DEEPSEEK_MODEL=${{ vars.DEEPSEEK_MODEL }}" >> .env.ec2
            echo "LLM_TEXT_PROVIDER=${{ vars.LLM_TEXT_PROVIDER }}" >> .env.ec2
            echo "ALIEXPRESS_RAPIDAPI_KEY=${{ secrets.ALIEXPRESS_RAPIDAPI_KEY }}" >> .env.ec2
            echo "AGENT_WORKER_ENABLED=${{ vars.AGENT_WORKER_ENABLED || 'false' }}" >> .env.ec2
            

            # Login au registre GHCR avec le token GitHub natif (packages: write déjà accordé)
            echo "${{ github.token }}" | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Espace disque : chaque déploiement apporte une image d'environ 1 Go. Un disque plein
            # empêche MongoDB de démarrer (ECONNREFUSED au précontrôle). Les images en service sont conservées.
            echo "Espace disque avant nettoyage :"; df -h / | tail -1
            sudo docker image prune -af --filter "until=48h" >/dev/null || true
            sudo docker builder prune -af >/dev/null 2>&1 || true
            echo "Espace disque après nettoyage :"; df -h / | tail -1

            # Diagnostic affiché dans les logs du workflow si une étape échoue
            diagnostic() {
              echo "::group::Diagnostic EC2"
              df -h / ; free -m || true
              sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml ps -a || true
              echo "--- Derniers logs MongoDB ---"
              sudo docker logs --tail 80 itvision-mongodb 2>&1 || true
              echo "::endgroup::"
            }

            # Pull de l'image avec retry (3 tentatives en cas de timeout réseau)
            MAX_RETRIES=3
            RETRY_DELAY=10
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Tentative $i/$MAX_RETRIES de pull de l'image..."
              if sudo docker pull ${DEPLOY_IMAGE}; then
                echo "Pull réussi!"
                break
              else
                if [ $i -eq $MAX_RETRIES ]; then
                  echo "Échec après $MAX_RETRIES tentatives"
                  exit 1
                fi
                echo "Échec, nouvelle tentative dans ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY * 2))
              fi
            done

            # Base et cache d'abord : le précontrôle (run --no-deps) suppose MongoDB en service.
            # Après un redémarrage de l'EC2 ou un crash, on le (re)démarre et on attend qu'il soit sain.
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml up -d --wait --wait-timeout 180 mongodb redis || { diagnostic; exit 1; }
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml run --rm --no-deps app node .ops/production-preflight.cjs || { diagnostic; exit 1; }
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml up -d --wait --wait-timeout 180 || { diagnostic; exit 1; }

            # Vérification santé
            echo "⏳ Attente démarrage app..."
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml exec -T app node scripts/check-production-runtime.cjs || { diagnostic; exit 1; }
            sudo docker compose --env-file .env.ec2 -f docker-compose.ec2.yml ps

            # Nettoyage des anciennes images (celles du déploiement précédent restent 48 h pour un retour arrière)
            sudo docker image prune -af --filter "until=48h" >/dev/null || true
