# Secrets GitHub requis (Settings > Secrets > Actions) :
#   APP_BASE_URL  — ex: https://market.itvisionplus.sn (sans slash final)
#   CRON_SECRET   — même valeur que .env: CRON_SECRET=xxx
#
# Réconciliateur quotidien : détecte les incohérences paiements ↔ commandes
# (fulfillment manquant, groupes expirés payés, remboursements à suivre,
# validations manuelles en retard, séquestres bloqués) et alerte l'admin
# par email si des anomalies critiques existent. Ne modifie aucune donnée.

name: Cron — Réconciliation paiements

on:
  schedule:
    # Tous les jours à 07h00 UTC (08h00 Dakar en hiver), avant les rappels groupes
    - cron: '0 7 * * *'
  workflow_dispatch: # Déclenchement manuel depuis l'UI GitHub

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lancer la réconciliation paiements
        run: |
          RESPONSE=$(curl -s -o /tmp/reconcile.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/reconcile-payments")
          cat /tmp/reconcile.json
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "ERREUR: Le réconciliateur a retourné HTTP $RESPONSE" >&2
            exit 1
          fi
          CRITICAL=$(grep -o '"critical":true' /tmp/reconcile.json || true)
          if [ -n "$CRITICAL" ]; then
            echo "⚠️  Anomalies critiques détectées — voir rapport ci-dessus (email admin envoyé)"
          fi
