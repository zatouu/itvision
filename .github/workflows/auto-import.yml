name: Auto Import 1688 / AliExpress

on:
  schedule:
    # Tous les jours à 02h00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: auto-import
  cancel-in-progress: false

jobs:
  auto-import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run auto-scrape
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/auto-scrape.ts --config-url "${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}/api/admin/auto-import"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-scrape-results
          path: auto-scrape-results-*.json
          if-no-files-found: ignore
